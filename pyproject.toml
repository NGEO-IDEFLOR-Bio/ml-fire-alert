[project]
name = "ml-fire-alert"
version = "0.1.0"
description = "Frente A (NGEO/IDEFLOR-Bio): risco de ignição em UCs estaduais do Pará (ML + SHAP)"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.1.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pyproj>=3.6.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
